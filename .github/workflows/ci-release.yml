name: CI and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q

  release:
    name: Build Windows Release
    runs-on: windows-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Build Windows EXE
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build_windows.ps1

      - name: Create checksum
        shell: pwsh
        run: |
          $exe = "dist\SonarQubeProfileCreator.exe"
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $exe
          "$($hash.Hash.ToLowerInvariant())  SonarQubeProfileCreator.exe" | Set-Content -Encoding ascii -Path "dist\SonarQubeProfileCreator.exe.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: SonarQube Profile Creator ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/SonarQubeProfileCreator.exe
            dist/SonarQubeProfileCreator.exe.sha256
